networks:
  yiipowered_public:
    name: yiipowered_public_php84
  yiipowered_private:
    name: yiipowered_private_php84

volumes:
  yiipowered_mysql_php84:
  php_socket_php84:

services:
  yiipowered:
    container_name: yiipowered_php84
    image: yiipowered:php8.4
    env_file:
      - .env
    build:
      context: "./"
      dockerfile: docker/php/Dockerfile
    volumes:
      - ".:/var/www"
      - "php_socket_php84:/var/run/php"
    depends_on:
      - mysql
    networks:
      - yiipowered_public
      - yiipowered_private
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    container_name: yiipowered_nginx_php84
    build:
      context: "./docker/nginx"
    volumes:
      - "./docker/nginx/local:/etc/nginx/conf.d:ro"
      - ".:/var/www"
      - "php_socket_php84:/var/run/php"
    ports:
      - "80:80"
    depends_on:
      - yiipowered
    networks:
      yiipowered_public:
        aliases:
          - yiipowered.test
      yiipowered_private: {}

  mysql:
    container_name: yiipowered_mysql_php84
    image: "mariadb:10.1.44"
    ports:
      - "3306:3306"
    volumes:
      - yiipowered_mysql_php84:/var/lib/mysql/data
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      DB_DSN: ${DB_DSN}
    networks:
      yiipowered_private:
        aliases:
          - mysql
          - yiipowered_mysql
